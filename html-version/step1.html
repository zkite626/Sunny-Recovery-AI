<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>情绪输入 · 晴愈AI</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="assets/logo.png">
</head>
<body>
  <div class="sunshine">
    <div class="orb orb--1"></div>
    <div class="orb orb--2"></div>
    <div class="orb orb--3"></div>
  </div>
  <div class="grain"></div>

  <div class="app">
    <div class="page page-enter">
      <!-- Progress -->
      <div class="progress-bar">
        <div class="progress-dot active"></div>
        <div class="progress-line"></div>
        <div class="progress-dot"></div>
        <div class="progress-line"></div>
        <div class="progress-dot"></div>
        <div class="progress-line"></div>
        <div class="progress-dot"></div>
        <div class="progress-line"></div>
        <div class="progress-dot"></div>
      </div>

      <!-- Navigation: homepage + API key trigger in one row -->
      <div class="nav-bar">
        <a href="index.html" class="btn btn-ghost btn-sm">🏠 首页</a>
        <button class="btn btn-ghost btn-sm" id="apiKeyBtn" onclick="openApiModal()">🔑 API Key</button>
      </div>

      <!-- Step 1: Emotion Input -->
      <div id="step1Content" class="section">
        <div class="text-center">
          <h2 class="heading-section">此刻，你的心情是？</h2>
          <p class="text-body">花一分钟感受自己，诚实面对内心</p>
        </div>

        <!-- Emotion Intensity Slider -->
        <div class="glass">
          <p class="text-caption" style="margin-bottom:var(--sp-4);">情绪强度</p>
          <div class="slider-value" id="sliderValue">5</div>
          <div class="slider-label" id="sliderLabel">中度不安</div>
          <div class="slider-wrap">
            <div class="slider-track">
              <input type="range" min="1" max="10" value="5" id="emotionSlider">
            </div>
          </div>
          <div style="display:flex; justify-content:space-between; font-size:var(--text-xs); color:var(--text-ghost); margin-top:var(--sp-2);">
            <span>平静</span>
            <span>严重困扰</span>
          </div>
        </div>

        <!-- Emotion Type Tags -->
        <div class="glass">
          <p class="text-caption" style="margin-bottom:var(--sp-4);">选择最接近的情绪</p>
          <div class="tag-grid" id="emotionTags"></div>
        </div>

        <!-- Text Input -->
        <div class="glass">
          <p class="text-caption" style="margin-bottom:var(--sp-4);">写下你的感受（想到什么写什么）</p>
          <textarea class="input-area" id="emotionText"
            placeholder="比如：明天就要考试了，我觉得自己什么都没准备好，脑子里乱糟糟的..."></textarea>
        </div>

        <!-- Next Button -->
        <div class="text-center">
          <button class="btn btn-sun btn-lg" id="nextBtn" onclick="goNext()">
            继续，探索身体感受 →
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- API Key Modal -->
  <div class="modal-overlay" id="apiModal">
    <div class="modal-box" style="position:relative;">
      <button class="modal-close" onclick="closeApiModal()">×</button>
      <h3 class="heading-section" style="margin-bottom:var(--sp-3); font-size:var(--text-xl);">🔑 设置 API Key</h3>
      <p class="text-body" style="margin-bottom:var(--sp-5);">
        本工具需要 DeepSeek API 来驱动 AI 对话。
      </p>
      <input type="password" class="input-line" id="apiKeyInput" placeholder="sk-..." style="margin-bottom:var(--sp-4);">
      <button class="btn btn-sun" style="width:100%;" onclick="saveApiKey()">保存</button>
      <p class="text-caption" style="margin-top:var(--sp-3); text-align:center;">
        Key 仅保存在本地浏览器，不会上传任何服务器
      </p>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/emotion.js"></script>
  <script src="js/api.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const mode = params.get('mode') || 'personal';

    // Update API key button style
    function updateApiBtnStyle() {
      const btn = document.getElementById('apiKeyBtn');
      if (getApiKey()) {
        btn.textContent = '🔑 已设置';
        btn.style.opacity = '0.6';
      }
    }
    updateApiBtnStyle();

    // Modal controls
    function openApiModal() {
      document.getElementById('apiModal').classList.add('open');
      const input = document.getElementById('apiKeyInput');
      const existing = getApiKey();
      if (existing) input.value = existing;
      input.focus();
    }

    function closeApiModal() {
      document.getElementById('apiModal').classList.remove('open');
    }

    // Close on overlay click
    document.getElementById('apiModal').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeApiModal();
    });

    // Close on Escape
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeApiModal();
    });

    function saveApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      if (!key) return;
      setApiKey(key);
      closeApiModal();
      updateApiBtnStyle();
      showToast('API Key 已保存 ✓');
    }

    // Render emotion tags
    const tagsContainer = document.getElementById('emotionTags');
    let selectedEmotion = null;

    EMOTION_TYPES.forEach(emo => {
      const tag = document.createElement('div');
      tag.className = 'tag';
      tag.textContent = `${emo.emoji} ${emo.label}`;
      tag.dataset.id = emo.id;
      tag.addEventListener('click', () => {
        document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
        tag.classList.add('active');
        selectedEmotion = emo.id;
      });
      tagsContainer.appendChild(tag);
    });

    // Slider
    const slider = document.getElementById('emotionSlider');
    const sliderValue = document.getElementById('sliderValue');
    const sliderLabel = document.getElementById('sliderLabel');

    function updateSlider() {
      const val = parseInt(slider.value);
      sliderValue.textContent = val;
      sliderLabel.textContent = getEmotionLabel(val);
      sliderValue.style.color = getEmotionColor(val);
    }

    slider.addEventListener('input', updateSlider);
    updateSlider();

    function goNext() {
      const text = document.getElementById('emotionText').value.trim();

      if (!selectedEmotion) {
        showToast('请先选择一个情绪标签');
        return;
      }
      if (!text) {
        showToast('请写下你的感受');
        return;
      }

      saveCurrent({
        mode: mode,
        emotionType: selectedEmotion,
        intensity: parseInt(slider.value),
        emotionText: text,
        startTime: new Date().toISOString()
      });

      location.href = `step2.html?mode=${mode}`;
    }

    function showToast(msg) {
      let toast = document.querySelector('.toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }
  </script>
</body>
</html>
