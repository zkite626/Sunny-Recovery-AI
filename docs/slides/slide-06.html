<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<style>
  .deco-green { background: #86c7a3; width: 220pt; height: 220pt; top: -70pt; right: -50pt; }
  .content-box { position: absolute; top: 50pt; left: 70pt; right: 70pt; }
  .tools-grid { display: flex; gap: 16pt; margin-top: 24pt; }
  .tool-card { flex: 1; padding: 18pt; border-radius: 12pt; background: rgba(255,255,255,0.6); border: 1px solid rgba(0,0,0,0.04); text-align: center; }
  .tool-icon { font-size: 32pt; margin-bottom: 10pt; }
  .tool-name { font-family: 'Noto Serif SC', serif; font-size: 14pt; font-weight: 600; color: #3d2e1f; margin-bottom: 6pt; }
  .tool-desc { font-size: 10pt; color: #7a6b5d; line-height: 1.6; }
  .page-num { position: absolute; bottom: 20pt; right: 30pt; font-size: 9pt; color: #b8a99a; }
</style>
</head>
<body>
  <div class="deco-circle deco-green"></div>

  <div class="content-box">
    <div style="margin-bottom:6pt;"><span class="badge">核心功能三</span></div>
    <h2>多维辅助工具</h2>
    <p style="margin-top:4pt; font-size:12pt;">正念呼吸、心理测评、感恩日记、情绪日历——全方位心理健康守护</p>

    <div class="tools-grid">
      <div class="tool-card">
        <div class="tool-icon">🫁</div>
        <div class="tool-name">正念呼吸</div>
        <p class="tool-desc">4-7-8 / 方形 / 共振<br>3种科学呼吸引导<br>动画可视化辅助</p>
      </div>
      <div class="tool-card">
        <div class="tool-icon">📊</div>
        <div class="tool-name">心理测评</div>
        <p class="tool-desc">PHQ-9 抑郁筛查<br>GAD-7 焦虑筛查<br>AI 个性化分析报告</p>
      </div>
      <div class="tool-card">
        <div class="tool-icon">🌿</div>
        <div class="tool-name">感恩日记</div>
        <p class="tool-desc">每天记录 3 件<br>感恩的小事<br>培养积极心态</p>
      </div>
      <div class="tool-card">
        <div class="tool-icon">📅</div>
        <div class="tool-name">情绪日历</div>
        <p class="tool-desc">日历可视化记录<br>连续打卡激励<br>8个成就徽章</p>
      </div>
    </div>
  </div>

  <div class="page-num">06</div>
</body>
</html>
