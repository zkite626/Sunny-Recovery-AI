<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<style>
  .deco-gold { background: #f6a623; width: 300pt; height: 300pt; top: -100pt; right: -80pt; }
  .content-box { position: absolute; top: 50pt; left: 70pt; right: 70pt; }
  .pain-grid { display: flex; gap: 16pt; margin-top: 24pt; }
  .pain-card { flex: 1; padding: 20pt; border-radius: 12pt; background: rgba(255,255,255,0.6); border: 1px solid rgba(0,0,0,0.04); }
  .pain-icon { font-size: 28pt; margin-bottom: 10pt; }
  .pain-title { font-family: 'Noto Serif SC', serif; font-size: 14pt; font-weight: 600; color: #3d2e1f; margin-bottom: 6pt; }
  .pain-desc { font-size: 11pt; color: #7a6b5d; line-height: 1.6; }
  .page-num { position: absolute; bottom: 20pt; right: 30pt; font-size: 9pt; color: #b8a99a; }
</style>
</head>
<body>
  <div class="deco-circle deco-gold"></div>

  <div class="content-box">
    <div style="margin-bottom:6pt;"><span class="badge">背景分析</span></div>
    <h2>大学生心理健康，不容忽视</h2>
    <p style="margin-top:8pt; font-size:13pt;">焦虑、内耗、自我否定……这些情绪正在影响越来越多大学生的日常生活</p>

    <div class="pain-grid">
      <div class="pain-card">
        <div class="pain-icon">😰</div>
        <div class="pain-title">学业焦虑</div>
        <p class="pain-desc">考前反复焦虑，<br>复习效率低，<br>越拖越焦虑</p>
      </div>
      <div class="pain-card">
        <div class="pain-icon">😞</div>
        <div class="pain-title">自我否定</div>
        <p class="pain-desc">完美主义导致<br>不敢开始，<br>反复自我批评</p>
      </div>
      <div class="pain-card">
        <div class="pain-icon">🥺</div>
        <div class="pain-title">社交压力</div>
        <p class="pain-desc">与同学对比进度，<br>产生自我怀疑，<br>回避社交</p>
      </div>
      <div class="pain-card">
        <div class="pain-icon">😶</div>
        <div class="pain-title">缺乏倾诉</div>
        <p class="pain-desc">心理咨询预约难，<br>不愿向身边人<br>袒露脆弱</p>
      </div>
    </div>
  </div>

  <div class="page-num">02</div>
</body>
</html>
