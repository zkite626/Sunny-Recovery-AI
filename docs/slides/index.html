<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>晴愈AI — 决赛演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a1a; display: flex; flex-direction: column; align-items: center; padding: 20px; font-family: sans-serif; }
  .slide-container { width: 960px; height: 540px; border: 2px solid #333; border-radius: 4px; overflow: hidden; margin-bottom: 10px; display: none; }
  .slide-container.active { display: block; }
  .controls { color: #999; font-size: 14px; margin-top: 10px; }
  .controls span { color: #f6a623; font-weight: bold; }
  kbd { background: #333; padding: 2px 6px; border-radius: 3px; font-size: 12px; }
</style>
</head>
<body>
  <div class="slide-container active" id="slide-1"><iframe src="slide-01.html" width="960" height="540" style="border:none;"></iframe></div>
  <div class="slide-container" id="slide-2"><iframe src="slide-02.html" width="960" height="540" style="border:none;"></iframe></div>
  <div class="slide-container" id="slide-3"><iframe src="slide-03.html" width="960" height="540" style="border:none;"></iframe></div>
  <div class="slide-container" id="slide-4"><iframe src="slide-04.html" width="960" height="540" style="border:none;"></iframe></div>
  <div class="slide-container" id="slide-5"><iframe src="slide-05.html" width="960" height="540" style="border:none;"></iframe></div>
  <div class="slide-container" id="slide-6"><iframe src="slide-06.html" width="960" height="540" style="border:none;"></iframe></div>
  <div class="slide-container" id="slide-7"><iframe src="slide-07-new.html" width="960" height="540" style="border:none;"></iframe></div>
  <div class="slide-container" id="slide-8"><iframe src="slide-07.html" width="960" height="540" style="border:none;"></iframe></div>
  <div class="slide-container" id="slide-9"><iframe src="slide-08.html" width="960" height="540" style="border:none;"></iframe></div>
  <div class="slide-container" id="slide-10"><iframe src="slide-09.html" width="960" height="540" style="border:none;"></iframe></div>
  <div class="slide-container" id="slide-11"><iframe src="slide-10.html" width="960" height="540" style="border:none;"></iframe></div>

  <div class="controls">
    <kbd>←</kbd> <kbd>→</kbd> 翻页 &nbsp;|&nbsp; 当前 <span id="current">1</span> / 11
  </div>

  <script>
    let current = 1;
    const total = 11;
    function show(n) {
      document.querySelectorAll('.slide-container').forEach(el => el.classList.remove('active'));
      document.getElementById('slide-' + n).classList.add('active');
      document.getElementById('current').textContent = n;
      current = n;
    }
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' && current < total) show(current + 1);
      if (e.key === 'ArrowLeft' && current > 1) show(current - 1);
    });
  </script>
</body>
</html>
