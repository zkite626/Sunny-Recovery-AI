<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<style>
  .deco-gold { background: #f6a623; width: 500pt; height: 500pt; top: -180pt; right: -150pt; }
  .deco-green { background: #86c7a3; width: 200pt; height: 200pt; bottom: -60pt; left: -40pt; }
  .deco-purple { background: #a78bfa; width: 160pt; height: 160pt; top: 60pt; left: 80pt; opacity: 0.05; }
  .sun-icon { font-size: 64pt; position: absolute; top: 100pt; right: 140pt; opacity: 0.1; }
  .center-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; width: 600pt; }
  .closing-title { font-family: 'Noto Serif SC', serif; font-size: 48pt; font-weight: 700; color: #3d2e1f; line-height: 1.3; }
  .closing-title em { font-style: normal; color: #f6a623; }
  .closing-sub { font-size: 16pt; color: #7a6b5d; margin-top: 16pt; line-height: 1.8; }
  .team-info { position: absolute; bottom: 50pt; left: 50%; transform: translateX(-50%); text-align: center; }
</style>
</head>
<body>
  <div class="deco-circle deco-gold"></div>
  <div class="deco-circle deco-green"></div>
  <div class="deco-circle deco-purple"></div>
  <div class="sun-icon">☀</div>

  <div class="center-box">
    <div class="closing-title">直面情绪<br><em>向阳而生</em></div>
    <p class="closing-sub">让每一个大学生，都能拥有一个温暖的心理健康伙伴</p>
    <div style="margin-top:32pt;">
      <div class="divider" style="background: linear-gradient(90deg, #f6a623, #86c7a3); margin: 0 auto;"></div>
    </div>
    <p style="margin-top:20pt; font-size:13pt; color:#b8a99a;">晴愈AI · 心理健康智能伙伴</p>
  </div>

  <div class="team-info">
    <p style="font-size:12pt; color:#b8a99a;">心晴小队 · 南宁师范大学 · 2026年4月</p>
    <p style="font-size:10pt; color:#b8a99a; margin-top:4pt;">李悦（组长）王梓 · 陈曦</p>
  </div>
</body>
</html>
