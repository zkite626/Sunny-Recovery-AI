<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<style>
  .deco-sky { background: #7dd3fc; width: 200pt; height: 200pt; bottom: -70pt; left: -50pt; }
  .content-box { position: absolute; top: 50pt; left: 70pt; right: 70pt; }
  .tools-grid { display: flex; gap: 16pt; margin-top: 24pt; }
  .tool-card { flex: 1; padding: 18pt; border-radius: 12pt; background: rgba(255,255,255,0.6); border: 1px solid rgba(0,0,0,0.04); text-align: center; }
  .tool-icon { font-size: 32pt; margin-bottom: 10pt; }
  .tool-name { font-family: 'Noto Serif SC', serif; font-size: 14pt; font-weight: 600; color: #3d2e1f; margin-bottom: 6pt; }
  .tool-desc { font-size: 10pt; color: #7a6b5d; line-height: 1.6; }
  .page-num { position: absolute; bottom: 20pt; right: 30pt; font-size: 9pt; color: #b8a99a; }
</style>
</head>
<body>
  <div class="deco-circle deco-sky"></div>

  <div class="content-box">
    <div style="margin-bottom:6pt;"><span class="badge">核心功能四</span></div>
    <h2>数字媒体艺术疗愈</h2>
    <p style="margin-top:4pt; font-size:12pt;">手势驱动粒子、AI冥想引导、情绪涂鸦——用艺术改善心情</p>

    <div class="tools-grid">
      <div class="tool-card">
        <div class="tool-icon">🌊</div>
        <div class="tool-name">沉浸式互动</div>
        <p class="tool-desc">手势/触摸驱动 Perlin 噪声<br>流场粒子系统<br>4种情绪色彩主题</p>
      </div>
      <div class="tool-card">
        <div class="tool-icon">🧘</div>
        <div class="tool-name">AI 正念冥想</div>
        <p class="tool-desc">4种冥想类型<br>呼吸动画+环境音<br>AI 个性化引导</p>
      </div>
      <div class="tool-card">
        <div class="tool-icon">🎨</div>
        <div class="tool-name">情绪涂鸦</div>
        <p class="tool-desc">4种艺术画笔<br>AI 色彩情绪分析<br>个人画廊保存</p>
      </div>
      <div class="tool-card">
        <div class="tool-icon">📅</div>
        <div class="tool-name">情绪日历</div>
        <p class="tool-desc">日历可视化记录<br>连续打卡成就<br>月度情绪分布</p>
      </div>
    </div>
  </div>

  <div class="page-num">07</div>
</body>
</html>
